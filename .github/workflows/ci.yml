name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # The api-error fixtures are copies of daml-escrow-commons' Go goldens;
  # they must match the commit recorded in test/fixtures/api-error/SOURCE,
  # or the TypeScript mirror is being tested against a stale contract.
  api-error-fixtures:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: source
        run: echo "sha=$(cat test/fixtures/api-error/SOURCE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: vdatacloud/daml-escrow-commons
          ref: ${{ steps.source.outputs.sha }}
          path: .commons
      - run: scripts/sync-api-error-fixtures.sh .commons
      - run: git diff --exit-code -- test/fixtures/api-error src/schema
