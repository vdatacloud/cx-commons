name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  graphify-out-untouched:
    # graphify-out/ is regenerated and committed on main by update-graph.yml
    # after merge; a PR that also changes it conflicts with that bot's
    # commits. Keep it out of PRs.
    name: graphify-out not modified
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject graphify-out changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD -- graphify-out/ | head -20)"
          if [ -n "$changed" ]; then
            echo "::error::This PR modifies graphify-out/, which is regenerated on main after merge. Drop those changes (git checkout origin/main -- graphify-out) and don't run graphify update locally."
            echo "$changed"
            exit 1
          fi

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: bash scripts/test-next-version.sh

  # The api-error fixtures are copies of daml-escrow-commons' Go goldens;
  # they must match the commit recorded in test/fixtures/api-error/SOURCE,
  # or the TypeScript mirror is being tested against a stale contract.
  api-error-fixtures:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: source
        run: echo "sha=$(cat test/fixtures/api-error/SOURCE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: vdatacloud/daml-escrow-commons
          ref: ${{ steps.source.outputs.sha }}
          path: .commons
      - run: scripts/sync-api-error-fixtures.sh .commons
      - run: git diff --exit-code -- test/fixtures/api-error test/fixtures/canton-id src/schema
