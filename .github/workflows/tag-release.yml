name: Tag release

# Runs on every push to main (i.e. every merged PR). The next version comes
# from the Conventional Commits since the last v* tag (scripts/next-version.sh,
# the same rules as every other repo -- see RELEASING.md): breaking or feat or
# a Deprecated: footer -> minor, small changes -> patch, docs/test/ci/chore
# only -> no release. Majors are never automatic (product releases, by hand).
# When a version is due it is released (tag + GitHub release), a floating
# `latest` tag is moved to it, and the package is published to npm.
#
# concurrency.group serializes runs of THIS workflow only -- if two pushes
# land close together, the second run queues behind the first rather than
# racing it. The retry loop below is defense in depth on top of that (e.g.
# someone pushes a tag by hand mid-run), not the primary safeguard.
on:
  push:
    branches: [main]

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write  # npm trusted publishing (OIDC) -- no stored npm token

jobs:
  tag:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Compute next version
        id: version
        run: |
          next="$(bash scripts/next-version.sh)"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ -z "$next" ]; then echo "No release-worthy commits since the last tag"; else echo "Next version: $next"; fi

      - name: Build and test
        if: steps.version.outputs.next != ''
        run: npm ci && npm run build && npm test

      # Tags are made server-side through the API, never `git push`: a pushed
      # tag is refused whenever the release includes a workflow-file change
      # ("refusing to allow a GitHub App to create or update workflow ...
      # without `workflows` permission"), which GITHUB_TOKEN can't hold.
      - name: Tag release
        id: tag
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch --tags --force origin
            next="$(bash scripts/next-version.sh)"
            [ -n "$next" ] || { echo "Already released by another run"; exit 0; }

            echo "Attempt $attempt: releasing $next"
            if gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes; then
              echo "version=${next#v}" >> "$GITHUB_OUTPUT"
              # The floating `latest` tag is informational (consumers install
              # from npm), so failing to move it doesn't fail the release.
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
                || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null \
                || echo "::warning::could not move the latest tag"
              exit 0
            fi

            echo "Release of $next refused (likely a race with another run) -- retrying"
            sleep $(( (RANDOM % 5) + 1 ))
          done

          echo "Failed to create a release after retries" >&2
          exit 1

      # Publishes the tagged version as @vdatacloud/cx-commons via npm
      # trusted publishing: npm verifies this workflow's OIDC token against
      # the package's Trusted Publisher setting on npmjs.com, so there's no
      # NPM_TOKEN secret to store or rotate. Provenance is attached
      # automatically. Needs npm >= 11.5.1.
      - name: Publish to npm
        if: steps.tag.outputs.version != ''
        run: |
          npm install -g npm@latest
          npm version "${{ steps.tag.outputs.version }}" --no-git-tag-version
          npm publish
